    <title>Catálogo de Drones</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f4;
            color: #333;
        }

        /* Encabezado oscuro superior estilo referencia */
        header {
            background-color: #111;
            color: #fff;
            text-align: center;
            padding: 30px 20px;
        }

        header h1 {
            font-size: 24px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        header p {
            font-size: 13px;
            color: #aaa;
        }

        /* Contenedor principal de la cuadrícula */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        /* Tarjeta de cada dron */
        .card {
            background-color: #fff;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        /* Contenedor de la imagen con efecto zoom */
        .image-box {
            width: 100%;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .image-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .card:hover .image-box img {
            transform: scale(1.1);
        }

        /* Título del modelo */
        .card h3 {
            font-size: 14px;
            color: #555;
            font-weight: normal;
        }
    </style>
</head>
